[package]
name = "mediaforge"
version = "1.1.0"
description = "MediaForge: download and convert media you're authorised to use"
authors = ["C2 Software"]
license = "LicenseRef-Proprietary"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "mediaforge_lib"
crate-type = ["rlib"]

[[bin]]
name = "mediaforge"
path = "src/main.rs"

[build-dependencies]
serde_json = "1.0.154"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs", "signal"] }
tokio-util = "0.7.20"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
# Keeps the build folder small: line tables are enough for readable backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
plist = "1.10.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }
